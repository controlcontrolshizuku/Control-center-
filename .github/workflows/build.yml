name: Build Control Center APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/app/cc app/src/main/res/values app/src/main/res/xml

          cat > app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.cc"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.cc.controlcenter"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          __EOF__

          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Control Center"
                  android:supportsRtl="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CCService"
                      android:exported="true"
                      android:label="Control Center"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          __EOF__

          cat > app/src/main/java/app/cc/Prefs.kt <<'__EOF__'
          package app.cc

          import android.content.Context

          object Prefs {
              private const val NAME = "cc_prefs_v2"
              private const val KEY_TILES = "enabled_tiles"
              private const val KEY_APPS = "pinned_apps"
              private const val KEY_THEME = "theme_mode"

              const val THEME_DARK = 0
              const val THEME_LIGHT = 1

              val ALL_TILES = listOf(
                  Ic.PLANE,
                  Ic.DATA,
                  Ic.WIFI,
                  Ic.BT,
                  Ic.ROT,
                  Ic.MOON,
                  Ic.TORCH,
                  Ic.LOCK
              )

              fun tileLabel(kind: Int): String = when (kind) {
                  Ic.PLANE -> "وضع الطيران"
                  Ic.DATA -> "بيانات الهاتف"
                  Ic.WIFI -> "واي فاي"
                  Ic.BT -> "بلوتوث"
                  Ic.ROT -> "قفل الدوران"
                  Ic.MOON -> "عدم الإزعاج"
                  Ic.TORCH -> "الكشاف"
                  Ic.LOCK -> "قفل الشاشة"
                  else -> "أداة"
              }

              private fun sp(ctx: Context) = ctx.getSharedPreferences(NAME, Context.MODE_PRIVATE)

              fun getTheme(ctx: Context): Int = sp(ctx).getInt(KEY_THEME, THEME_DARK)
              fun setTheme(ctx: Context, mode: Int) {
                  sp(ctx).edit().putInt(KEY_THEME, mode).apply()
              }

              fun getTiles(ctx: Context): MutableList<Int> {
                  val raw = sp(ctx).getString(KEY_TILES, null)
                  if (raw.isNullOrBlank()) return ALL_TILES.toMutableList()
                  val parsed = raw.split(",").mapNotNull { it.trim().toIntOrNull() }
                      .filter { it in ALL_TILES }
                      .distinct()
                      .toMutableList()
                  return if (parsed.isEmpty()) ALL_TILES.toMutableList() else parsed
              }

              fun saveTiles(ctx: Context, list: List<Int>) {
                  val valid = list.filter { it in ALL_TILES }.distinct()
                  sp(ctx).edit().putString(KEY_TILES, valid.joinToString(",")).apply()
              }

              fun toggleTile(ctx: Context, kind: Int): MutableList<Int> {
                  val cur = getTiles(ctx)
                  if (kind in cur) {
                      if (cur.size > 1) cur.remove(kind)
                  } else {
                      cur.add(kind)
                  }
                  saveTiles(ctx, cur)
                  return cur
              }

              fun moveTile(ctx: Context, kind: Int, delta: Int): MutableList<Int> {
                  val cur = getTiles(ctx)
                  val idx = cur.indexOf(kind)
                  if (idx == -1) return cur
                  val target = (idx + delta).coerceIn(0, cur.lastIndex)
                  if (target != idx) {
                      cur.removeAt(idx)
                      cur.add(target, kind)
                      saveTiles(ctx, cur)
                  }
                  return cur
              }

              fun getPinnedApps(ctx: Context): MutableList<String> {
                  val raw = sp(ctx).getString(KEY_APPS, "") ?: ""
                  if (raw.isBlank()) return mutableListOf()
                  return raw.split("|").map { it.trim() }.filter { it.isNotEmpty() }.distinct().toMutableList()
              }

              fun savePinnedApps(ctx: Context, pkgs: List<String>) {
                  sp(ctx).edit().putString(KEY_APPS, pkgs.distinct().joinToString("|")).apply()
              }

              fun togglePinnedApp(ctx: Context, pkg: String): MutableList<String> {
                  val cur = getPinnedApps(ctx)
                  if (pkg in cur) cur.remove(pkg) else cur.add(pkg)
                  savePinnedApps(ctx, cur)
                  return cur
              }

              fun resetAll(ctx: Context) {
                  sp(ctx).edit().clear().apply()
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/CCService.kt <<'__EOF__'
          package app.cc

          import android.accessibilityservice.AccessibilityService
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          class CCService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: CCService? = null
              }

              var panel: Panel? = null
              private var trigger: View? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  panel = Panel(this)
                  addTrigger()
              }

              fun reloadPanel() {
                  panel?.hideNow()
                  panel = Panel(this)
                  addTrigger()
              }

              private fun addTrigger() {
                  removeTrigger()
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val v = View(this)
                  var y0 = 0f
                  var fired = false
                  val threshold = dpf(36f)
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              y0 = e.rawY
                              fired = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!fired && e.rawY - y0 > threshold) {
                                  fired = true
                                  panel?.show()
                              }
                          }
                      }
                      true
                  }
                  val lp = WindowManager.LayoutParams(
                      dpi(96f),
                      maxOf(statusBarH(), dpi(30f)),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.END
                  try {
                      wm.addView(v, lp)
                      trigger = v
                  } catch (t: Throwable) {
                  }
              }

              private fun removeTrigger() {
                  val v = trigger ?: return
                  trigger = null
                  try {
                      (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(v)
                  } catch (t: Throwable) {
                  }
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) panel?.hideIfStale()
              }

              override fun onInterrupt() {}

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  panel?.hideNow()
                  addTrigger()
              }

              override fun onDestroy() {
                  removeTrigger()
                  panel?.hideNow()
                  instance = null
                  super.onDestroy()
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/Ic.kt <<'__EOF__'
          package app.cc

          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF

          object Ic {
              const val WIFI = 0
              const val DATA = 1
              const val BT = 2
              const val PLANE = 3
              const val ROT = 4
              const val MOON = 5
              const val TORCH = 6
              const val SUN = 7
              const val VOL = 8
              const val LOCK = 9
              const val PLAY = 10
              const val PAUSE = 11
              const val NEXT = 12
              const val PREV = 13

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  strokeWidth = 2f
              }
              private val rect = RectF()

              private fun poly(vararg p: Float): Path {
                  val path = Path()
                  path.moveTo(p[0], p[1])
                  var i = 2
                  while (i < p.size) {
                      path.lineTo(p[i], p[i + 1])
                      i += 2
                  }
                  path.close()
                  return path
              }

              private val moon = Path().apply {
                  addCircle(12f, 12f, 9f, Path.Direction.CW)
                  val b = Path()
                  b.addCircle(17.5f, 7.5f, 7.5f, Path.Direction.CW)
                  op(b, Path.Op.DIFFERENCE)
              }

              private val plane = Path().apply {
                  moveTo(21f, 16f)
                  lineTo(21f, 14f)
                  lineTo(13f, 9f)
                  lineTo(13f, 3.5f)
                  cubicTo(13f, 2.67f, 12.33f, 2f, 11.5f, 2f)
                  cubicTo(10.67f, 2f, 10f, 2.67f, 10f, 3.5f)
                  lineTo(10f, 9f)
                  lineTo(2f, 14f)
                  lineTo(2f, 16f)
                  lineTo(10f, 13.5f)
                  lineTo(10f, 19f)
                  lineTo(8f, 20.5f)
                  lineTo(8f, 22f)
                  lineTo(11.5f, 21f)
                  lineTo(15f, 22f)
                  lineTo(15f, 20.5f)
                  lineTo(13f, 19f)
                  lineTo(13f, 13.5f)
                  lineTo(21f, 16f)
                  close()
              }

              private val bt = Path().apply {
                  moveTo(7f, 8f)
                  lineTo(17f, 16f)
                  lineTo(12f, 20f)
                  lineTo(12f, 4f)
                  lineTo(17f, 8f)
                  lineTo(7f, 16f)
              }

              private val torch = poly(8f, 3f, 16f, 3f, 16f, 8f, 14f, 11f, 14f, 21f, 10f, 21f, 10f, 11f, 8f, 8f)
              private val speaker = poly(3f, 9f, 7f, 9f, 12f, 5f, 12f, 19f, 7f, 15f, 3f, 15f)
              private val play = poly(8f, 5f, 19f, 12f, 8f, 19f)

              private fun next(c: Canvas) {
                  c.drawPath(poly(5f, 6f, 14f, 12f, 5f, 18f), fill)
                  rect.set(15.5f, 6f, 18.5f, 18f)
                  c.drawRoundRect(rect, 1f, 1f, fill)
              }

              fun draw(c: Canvas, kind: Int, size: Float, color: Int) {
                  val s = size / 24f
                  c.save()
                  c.scale(s, s)
                  fill.color = color
                  line.color = color
                  line.strokeWidth = 2f
                  when (kind) {
                      WIFI -> {
                          line.strokeWidth = 2.3f
                          for (r in floatArrayOf(5f, 9.5f, 14f)) {
                              rect.set(12f - r, 19f - r, 12f + r, 19f + r)
                              c.drawArc(rect, 225f, 90f, false, line)
                          }
                          c.drawCircle(12f, 19f, 1.8f, fill)
                      }
                      DATA -> {
                          rect.set(4f, 15f, 7.5f, 21f)
                          c.drawRoundRect(rect, 1.2f, 1.2f, fill)
                          rect.set(10.2f, 10f, 13.7f, 21f)
                          c.drawRoundRect(rect, 1.2f, 1.2f, fill)
                          rect.set(16.5f, 4f, 20f, 21f)
                          c.drawRoundRect(rect, 1.2f, 1.2f, fill)
                      }
                      BT -> c.drawPath(bt, line)
                      PLANE -> {
                          c.save()
                          c.rotate(90f, 12f, 12f)
                          c.drawPath(plane, fill)
                          c.restore()
                      }
                      ROT -> {
                          rect.set(3f, 3f, 21f, 21f)
                          c.drawArc(rect, 140f, 280f, false, line)
                          rect.set(9f, 11.5f, 15f, 17f)
                          c.drawRoundRect(rect, 1f, 1f, fill)
                          line.strokeWidth = 1.6f
                          rect.set(10f, 7f, 14f, 13f)
                          c.drawArc(rect, 180f, 180f, false, line)
                      }
                      MOON -> c.drawPath(moon, fill)
                      TORCH -> c.drawPath(torch, fill)
                      SUN -> {
                          c.drawCircle(12f, 12f, 4.2f, fill)
                          for (i in 0 until 8) {
                              val a = Math.toRadians(i * 45.0)
                              val x1 = (12 + Math.cos(a) * 7.4).toFloat()
                              val y1 = (12 + Math.sin(a) * 7.4).toFloat()
                              val x2 = (12 + Math.cos(a) * 10.0).toFloat()
                              val y2 = (12 + Math.sin(a) * 10.0).toFloat()
                              c.drawLine(x1, y1, x2, y2, line)
                          }
                      }
                      VOL -> {
                          c.drawPath(speaker, fill)
                          rect.set(7.5f, 7.5f, 16.5f, 16.5f)
                          c.drawArc(rect, -45f, 90f, false, line)
                          rect.set(4f, 4f, 20f, 20f)
                          c.drawArc(rect, -45f, 90f, false, line)
                      }
                      LOCK -> {
                          rect.set(6f, 11f, 18f, 21f)
                          c.drawRoundRect(rect, 2f, 2f, fill)
                          line.strokeWidth = 2.2f
                          rect.set(8f, 3f, 16f, 16f)
                          c.drawArc(rect, 180f, 180f, false, line)
                          c.drawLine(8f, 9.5f, 8f, 11f, line)
                          c.drawLine(16f, 9.5f, 16f, 11f, line)
                      }
                      PLAY -> c.drawPath(play, fill)
                      PAUSE -> {
                          rect.set(6f, 5f, 10f, 19f)
                          c.drawRoundRect(rect, 1f, 1f, fill)
                          rect.set(14f, 5f, 18f, 19f)
                          c.drawRoundRect(rect, 1f, 1f, fill)
                      }
                      NEXT -> next(c)
                      PREV -> {
                          c.translate(24f, 0f)
                          c.scale(-1f, 1f)
                          next(c)
                      }
                  }
                  c.restore()
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/MainActivity.kt <<'__EOF__'
          package app.cc

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import rikka.shizuku.Shizuku

          class MainActivity : Activity() {

              private lateinit var rootLayout: LinearLayout
              private lateinit var statusView: TextView
              private lateinit var bodyContainer: LinearLayout
              private lateinit var navHome: Button
              private lateinit var navCustomize: Button
              private lateinit var navSettings: Button

              private var currentTab = 0

              private val permL = Shizuku.OnRequestPermissionResultListener { _, _ -> runOnUiThread { refreshStatus() } }
              private val binderL = Shizuku.OnBinderReceivedListener { runOnUiThread { refreshStatus() } }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun cardBg(light: Boolean): GradientDrawable = GradientDrawable().apply {
                  cornerRadius = dpf(20f)
                  setColor(if (light) 0xCCFFFFFF.toInt() else 0x26FFFFFF)
                  setStroke(dpi(1f), if (light) 0x44000000 else 0x33FFFFFF)
              }

              private fun pillBg(active: Boolean, light: Boolean): GradientDrawable = GradientDrawable().apply {
                  cornerRadius = dpf(14f)
                  setColor(
                      when {
                          active -> 0xFF0A84FF.toInt()
                          light -> 0x99FFFFFF.toInt()
                          else -> 0x1FFFFFFF
                      }
                  )
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val light = Prefs.getTheme(this) == Prefs.THEME_LIGHT
                  val pad = dpi(16f)

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(if (light) 0xFFE8EEF5.toInt() else 0xFF101216.toInt())
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, dpi(10f))
                  }
                  val title = TextView(this).apply {
                      text = "Control Center"
                      textSize = 26f
                      setTextColor(if (light) 0xFF111827.toInt() else Color.WHITE)
                  }
                  statusView = TextView(this).apply {
                      textSize
