          package app.cc

          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: Prefs
              private lateinit var panel: Panel

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)
                  panel = Panel(this)
                  renderUi()
              }

              override fun onResume() {
                  super.onResume()
                  renderUi()
              }

              private fun renderUi() {
                  val dp = resources.displayMetrics.density
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B1220"))
                      setPadding((16 * dp).toInt(), (20 * dp).toInt(), (16 * dp).toInt(), (24 * dp).toInt())
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  fun sectionTitle(txt: String) = TextView(this).apply {
                      text = txt
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setPadding(0, (12 * dp).toInt(), 0, (6 * dp).toInt())
                  }

                  fun bodyText(txt: String) = TextView(this).apply {
                      text = txt
                      textSize = 13.5f
                      setTextColor(Color.parseColor("#CBD5E1"))
                      setPadding(0, (2 * dp).toInt(), 0, (6 * dp).toInt())
                  }

                  root.addView(sectionTitle("Control Center - Liquid Glass"))
                  root.addView(
                      bodyText(
                          "1) فعّل الظهور فوق التطبيقات الأخرى.\n" +
                              "2) فعّل خدمة Accessibility للسحب من أعلى اليمين وقفل الشاشة.\n" +
                              "3) فعّل Shizuku لأوامر النظام الإضافية."
                      )
                  )

                  val overlayOk = Settings.canDrawOverlays(this)
                  root.addView(Button(this).apply {
                      text = if (overlayOk) "الظهور فوق التطبيقات: مفعّل" else "تفعيل الظهور فوق التطبيقات"
                      setOnClickListener {
                          val i = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(i)
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "فتح إعدادات Accessibility"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  root.addView(Button(this).apply {
                      text = if (ShizukuBridge.isShizukuInstalled(this@MainActivity)) {
                          "فتح Shizuku"
                      } else {
                          "تحميل / فتح Shizuku"
                      }
                      setOnClickListener {
                          ShizukuBridge.openShizukuOrGuide(this@MainActivity)
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "فتح / إغلاق لوحة التحكم الآن"
                      setOnClickListener {
                          panel.toggle()
                      }
                  })

                  root.addView(CheckBox(this).apply {
                      text = "استخدام Shizuku للأوامر الإضافية"
                      isChecked = prefs.useShizuku
                      setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, checked -> prefs.useShizuku = checked }
                  })

                  root.addView(CheckBox(this).apply {
                      text = "ثيم زجاجي فاتح (Light Liquid Glass)"
                      isChecked = prefs.lightTheme
                      setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, checked -> prefs.lightTheme = checked }
                  })

                  root.addView(sectionTitle("الأزرار والاختصارات المفعّلة"))
                  val activeSet = prefs.activeTiles.toMutableSet()
                  val allKeys = prefs.allAvailableTiles()

                  for (k in allKeys) {
                      root.addView(CheckBox(this).apply {
                          text = prefs.labelFor(k)
                          isChecked = activeSet.contains(k)
                          setTextColor(Color.parseColor("#E2E8F0"))
                          setOnCheckedChangeListener { _, checked ->
                              if (checked) activeSet.add(k) else activeSet.remove(k)
                              prefs.activeTiles = activeSet.toList()
                          }
                      })
                  }

                  root.addView(sectionTitle("إضافة اختصار تطبيق مخصص"))
                  val installedApps = packageManager.getInstalledApplications(0)
                      .filter { packageManager.getLaunchIntentForPackage(it.packageName) != null }
                      .sortedBy { packageManager.getApplicationLabel(it).toString().lowercase() }

                  val appNames = installedApps.map {
                      val lbl = packageManager.getApplicationLabel(it).toString()
                      "$lbl (${it.packageName})"
                  }

                  val spinner = Spinner(this).apply {
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          appNames
                      )
                  }
                  root.addView(spinner)

                  root.addView(Button(this).apply {
                      text = "إضافة التطبيق كاختصار في اللوحة"
                      gravity = Gravity.CENTER
                      setOnClickListener {
                          val idx = spinner.selectedItemPosition
                          if (idx in installedApps.indices) {
                              val appInfo = installedApps[idx]
                              val appLabel = packageManager.getApplicationLabel(appInfo).toString()
                              val token = "custom::$appLabel::${appInfo.packageName}"
                              prefs.customShortcuts = prefs.customShortcuts + token
                              prefs.activeTiles = prefs.activeTiles + token
                              Toast.makeText(this@MainActivity, "تمت إضافة $appLabel", Toast.LENGTH_SHORT).show()
                              renderUi()
                          }
                      }
                  })

                  scroll.addView(root)
                  setContentView(scroll)
              }
          }
