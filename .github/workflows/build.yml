                      setOnClickListener {
                          Prefs.setTheme(this@MainActivity, Prefs.THEME_LIGHT)
                          recreate()
                      }
                  }
                  val resetBtn = Button(this).apply {
                      text = "استعادة الإعدادات الافتراضية"
                      setOnClickListener {
                          Prefs.resetAll(this@MainActivity)
                          CCService.instance?.reloadPanel()
                          recreate()
                      }
                  }

                  themeCard.addView(darkBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dpi(6f) })
                  themeCard.addView(lightBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dpi(6f) })
                  themeCard.addView(resetBtn)
                  bodyContainer.addView(themeCard)

                  val tipCard = makeCard(light)
                  tipCard.addView(sectionTitle("ملاحظات الاستخدام على أندرويد 14", light))
                  val tipTv = TextView(this).apply {
                      text = "لو خيار Accessibility رمادي: إعدادات الموبايل > التطبيقات > Control Center > القائمة (⋮) > السماح بالإعدادات المقيّدة، وبعدها فعّل الخدمة.\n\n" +
                          "الواي فاي والبلوتوث والداتا ووضع الطيران والتركيز والسطوع تحتاج Shizuku مفعّلاً وممنوحاً الإذن."
                      textSize = 14f
                      setTextColor(if (light) 0xFF374151.toInt() else 0xFFD1D5DB.toInt())
                  }
                  tipCard.addView(tipTv)
                  bodyContainer.addView(tipCard)
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }

              override fun onDestroy() {
                  try {
                      Shizuku.removeRequestPermissionResultListener(permL)
                      Shizuku.removeBinderReceivedListener(binderL)
                  } catch (t: Throwable) {
                  }
                  super.onDestroy()
              }

              private fun refreshStatus() {
                  val sh = when {
                      Sh.ready() -> "✅ Shizuku شغّال ومعاه إذن"
                      Sh.running() -> "⚠️ Shizuku شغّال بس لسه من غير إذن"
                      else -> "❌ Shizuku مش شغّال"
                  }
                  val acc = if (CCService.instance != null) "✅ خدمة Accessibility شغّالة" else "❌ خدمة Accessibility مش مفعّلة"
                  statusView.text = "$sh  |  $acc"
              }
          }
