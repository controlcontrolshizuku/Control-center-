                          val appName = try {
                              val ai = packageManager.getApplicationInfo(pkg, 0)
                              packageManager.getApplicationLabel(ai).toString()
                          } catch (t: Throwable) {
                              pkg
                          }
                          val r = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              setPadding(0, dpi(3f), 0, dpi(3f))
                          }
                          val tv = TextView(this).apply {
                              text = "📱 $appName"
                              textSize = 14f
                              setTextColor(if (light) 0xFF111827.toInt() else Color.WHITE)
                          }
                          val rem = Button(this).apply {
                              text = "حذف"
                              setOnClickListener {
                                  Prefs.togglePinnedApp(this@MainActivity, pkg)
                                  CCService.instance?.reloadPanel()
                                  renderBody()
                              }
                          }
                          r.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                          r.addView(rem)
                          appsCard.addView(r)
                      }
                  }
                  bodyContainer.addView(appsCard)
              }

              private fun openAppPickerDialog() {
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val resolveList = packageManager.queryIntentActivities(mainIntent, 0)
                  val items = resolveList
                      .map { it.activityInfo.packageName to it.loadLabel(packageManager).toString() }
                      .distinctBy { it.first }
                      .filter { it.first != packageName }
                      .sortedBy { it.second.lowercase() }

                  if (items.isEmpty()) {
                      toast("لا توجد تطبيقات متاحة للاختيار")
                      return
                  }

                  val labels = items.map { it.second }.toTypedArray()
                  val currentPinned = Prefs.getPinnedApps(this).toMutableSet()
                  val checked = items.map { it.first in currentPinned }.toBooleanArray()

                  AlertDialog.Builder(this)
                      .setTitle("اختر التطبيقات للكنترول سنتر")
                      .setMultiChoiceItems(labels, checked) { _, which, isChecked ->
                          val pkg = items[which].first
                          if (isChecked) currentPinned.add(pkg) else currentPinned.remove(pkg)
                      }
                      .setPositiveButton("حفظ") { _, _ ->
                          Prefs.savePinnedApps(this, currentPinned.toList())
                          CCService.instance?.reloadPanel()
                          renderBody()
                          toast("تم تحديث التطبيقات")
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun buildSettingsTab(light: Boolean) {
