                  val mediaBox = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((16 * dp).toInt(), (14 * dp).toInt(), (16 * dp).toInt(), (14 * dp).toInt())
                      background = glassPill(false, light, 64f)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.05f)
                          .apply { rightMargin = (7 * dp).toInt() }
                  }

                  val mediaTop = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val noteIcon = LiquidIconView(context, "media", Color.WHITE).apply {
                      val sz = (24 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                  }
                  val mediaSpacer = View(context).apply {
                      layoutParams = LinearLayout.LayoutParams(0, 1, 1f)
                  }
                  val castIcon = LiquidIconView(context, "device_controls", Color.WHITE).apply {
                      val sz = (24 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                      setOnClickListener {
                          ShizukuBridge.openSettingsFallback(context, Settings.ACTION_CAST_SETTINGS)
                      }
                  }
                  mediaTop.addView(noteIcon)
                  mediaTop.addView(mediaSpacer)
                  mediaTop.addView(castIcon)

                  val notPlaying = TextView(context).apply {
                      text = "Not playing"
                      textSize = 15f
                      setTextColor(Color.parseColor("#E2E8F0"))
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, 0, 1f)
                          .apply { topMargin = (18 * dp).toInt() }
                  }

                  val transportRow = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  fun mediaBtn(label: String, keyCode: Int) = Button(context).apply {
                      text = label
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      background = null
                      layoutParams = LinearLayout.LayoutParams(0, (40 * dp).toInt(), 1f)
                      setPadding(0, 0, 0, 0)
                      setOnClickListener {
                          try {
                              am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, keyCode))
                              am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, keyCode))
                          } catch (_: Throwable) {
                          }
                      }
                  }
                  transportRow.addView(mediaBtn("⏮", KeyEvent.KEYCODE_MEDIA_PREVIOUS))
                  transportRow.addView(mediaBtn("▶", KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                  transportRow.addView(mediaBtn("⏭", KeyEvent.KEYCODE_MEDIA_NEXT))

                  mediaBox.addView(mediaTop)
                  mediaBox.addView(notPlaying)
                  mediaBox.addView(transportRow)

                  val brightSlider = VerticalGlassSlider(context, "brightness", light) { v, _ ->
                      val target = (v * 255f).toInt().coerceIn(5, 255)
                      if (prefs.useShizuku) ShizukuBridge.runShellCommand("settings put system screen_brightness $target")
                      try {
                          Settings.System.putInt(context.contentResolver, Settings.System.SCREEN_BRIGHTNESS, target)
                      } catch (_: Throwable) {
                      }
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 0.52f)
                          .apply { leftMargin = (7 * dp).toInt(); rightMargin = (7 * dp).toInt() }
                  }
                  val curBright = try {
                      Settings.System.getInt(context.contentResolver, Settings.System.SCREEN_BRIGHTNESS) / 255f
                  } catch (_: Throwable) {
                      0.55f
                  }
                  brightSlider.setLevel(curBright.coerceIn(0.1f, 1f))

                  val volSlider = VerticalGlassSlider(context, "volume", light) { v, _ ->
                      val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                      val target = (v * max).toInt().coerceIn(0, max)
                      if (prefs.useShizuku) {
                          ShizukuBridge.runShellCommand("cmd media_session volume --stream 3 --set $target")
                      }
                      try {
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, target, 0)
                      } catch (_: Throwable) {
                      }
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 0.52f)
                  }
                  val maxVol = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                  volSlider.setLevel((am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / maxVol).coerceIn(0.1f, 1f))

                  row2.addView(mediaBox)
                  row2.addView(brightSlider)
                  row2.addView(volSlider)
                  col.addView(row2)

                  val row3 = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (74 * dp).toInt()
                      ).apply { topMargin = (14 * dp).toInt() }
                  }

                  val ringerBar = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding((8 * dp).toInt(), (8 * dp).toInt(), (8 * dp).toInt(), (8 * dp).toInt())
                      background = glassPill(false, light, 999f)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.05f)
                          .apply { rightMargin = (7 * dp).toInt() }
                  }

                  var ringerMode = am.ringerMode
                  fun ringerSlot(modeVal: Int, kind: String, activeColor: Int) = FrameLayout(context).apply {
                      val isSel = ringerMode == modeVal
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f)
                      background = if (isSel) circleBadge(true) else null
                      val ic = LiquidIconView(context, kind, if (isSel) activeColor else Color.WHITE).apply {
                          val sz = (24 * dp).toInt()
                          layoutParams = FrameLayout.LayoutParams(sz, sz, Gravity.CENTER)
                      }
                      addView(ic)
                      setOnClickListener {
                          ringerMode = modeVal
                          if (prefs.useShizuku) ShizukuBridge.setRingerMode(context, modeVal)
                          else {
                              try { am.ringerMode = modeVal } catch (_: Throwable) {}
                          }
                          hideNow()
                          show()
                      }
                  }

                  ringerBar.addView(ringerSlot(AudioManager.RINGER_MODE_NORMAL, "sound", Color.parseColor("#EF4444")))
                  ringerBar.addView(ringerSlot(AudioManager.RINGER_MODE_VIBRATE, "vibrate", Color.parseColor("#3B82F6")))
                  ringerBar.addView(ringerSlot(AudioManager.RINGER_MODE_SILENT, "silent", Color.parseColor("#94A3B8")))

                  val dndCircle = FrameLayout(context).apply {
                      val sz = (74 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz).apply { leftMargin = (7 * dp).toInt(); rightMargin = (7 * dp).toInt() }
                      background = circleBadge(!dndOn)
                      val ic = LiquidIconView(context, "dnd", Color.parseColor("#2563EB")).apply {
                          val isz = (30 * dp).toInt()
                          layoutParams = FrameLayout.LayoutParams(isz, isz, Gravity.CENTER)
                      }
                      addView(ic)
                      setOnClickListener {
                          dndOn = !dndOn
                          if (prefs.useShizuku) ShizukuBridge.setZenMode(if (dndOn) 2 else 0)
                          else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_ZEN_MODE_PRIORITY_SETTINGS)
                          background = circleBadge(!dndOn)
                      }
                  }

                  val soundCircle = FrameLayout(context).apply {
                      val sz = (74 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                      background = circleBadge(true)
                      val ic = LiquidIconView(context, "sound", Color.parseColor("#DC2626")).apply {
                          val isz = (30 * dp).toInt()
                          layoutParams = FrameLayout.LayoutParams(isz, isz, Gravity.CENTER)
                      }
                      addView(ic)
                      setOnClickListener {
                          ShizukuBridge.openSettingsFallback(context, Settings.ACTION_SOUND_SETTINGS)
                      }
                  }

                  row3.addView(ringerBar)
                  row3.addView(dndCircle)
                  row3.addView(soundCircle)
                  col.addView(row3)

                  val row4 = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (74 * dp).toInt()
                      ).apply { topMargin = (14 * dp).toInt() }
                  }

                  var btOn = false
                  val btCard = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding((14 * dp).toInt(), (10 * dp).toInt(), (14 * dp).toInt(), (10 * dp).toInt())
                      background = glassPill(btOn, light, 999f)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f)
                          .apply { rightMargin = (7 * dp).toInt() }
                  }
                  val btIcon = LiquidIconView(context, "bluetooth", Color.parseColor("#60A5FA")).apply {
                      val sz = (26 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                  }
                  val btLabel = TextView(context).apply {
                      text = "Bluetooth"
                      textSize = 15.5f
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          .apply { leftMargin = (12 * dp).toInt() }
                  }
                  btCard.addView(btIcon)
                  btCard.addView(btLabel)
                  btCard.setOnClickListener {
                      btOn = !btOn
                      if (prefs.useShizuku) ShizukuBridge.setBluetoothEnabled(btOn)
                      else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_BLUETOOTH_SETTINGS)
                      btCard.background = glassPill(btOn, light, 999f)
                      btIcon.setTint(if (btOn) Color.parseColor("#2563EB") else Color.parseColor("#60A5FA"))
                      btLabel.setTextColor(if (btOn) Color.parseColor("#0F172A") else Color.WHITE)
                  }

                  val torchCard = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding((14 * dp).toInt(), (10 * dp).toInt(), (14 * dp).toInt(), (10 * dp).toInt())
                      background = glassPill(torchOn, light, 999f)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f)
                          .apply { leftMargin = (7 * dp).toInt() }
                  }
                  val torchIcon = LiquidIconView(context, "torch", Color.WHITE).apply {
                      val sz = (26 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                  }
                  val torchLabel = TextView(context).apply {
                      text = "Torch"
                      textSize = 15.5f
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          .apply { leftMargin = (12 * dp).toInt() }
                  }
                  torchCard.addView(torchIcon)
                  torchCard.addView(torchLabel)
                  torchCard.setOnClickListener {
                      val next = !torchOn
                      try {
                          val cm = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          val camId = cm.cameraIdList.firstOrNull { id ->
                              val c = cm.getCameraCharacteristics(id)
                              val flash = c.get(android.hardware.camera2.CameraCharacteristics.FLASH_INFO_AVAILABLE) ?: false
                              val facing = c.get(android.hardware.camera2.CameraCharacteristics.LENS_FACING)
                              flash && facing == android.hardware.camera2.CameraCharacteristics.LENS_FACING_BACK
                          } ?: cm.cameraIdList.firstOrNull()
                          if (camId != null) {
                              cm.setTorchMode(camId, next)
                              torchOn = next
                          }
                      } catch (_: Throwable) {
                      }
                      torchCard.background = glassPill(torchOn, light, 999f)
                      torchIcon.setTint(if (torchOn) Color.parseColor("#0F172A") else Color.WHITE)
                      torchLabel.setTextColor(if (torchOn) Color.parseColor("#0F172A") else Color.WHITE)
                  }

                  row4.addView(btCard)
                  row4.addView(torchCard)
                  col.addView(row4)

                  var rotOn = true
                  fun circleTile(kind: String, isActive: Boolean, iconTint: Int, onTap: () -> Unit): FrameLayout {
                      val sz = (74 * dp).toInt()
                      return FrameLayout(context).apply {
                          layoutParams = LinearLayout.LayoutParams(0, sz, 1f).apply {
                              setMargins((5 * dp).toInt(), 0, (5 * dp).toInt(), 0)
                          }
                          background = circleBadge(isActive)
                          val ic = LiquidIconView(context, kind, iconTint).apply {
                              val isz = (28 * dp).toInt()
                              layoutParams = FrameLayout.LayoutParams(isz, isz, Gravity.CENTER)
                          }
                          addView(ic)
                          setOnClickListener { onTap() }
                      }
                  }

                  val row5 = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = (14 * dp).toInt() }
                  }
                  row5.addView(circleTile("airplane", false, Color.WHITE) {
                      if (prefs.useShizuku) ShizukuBridge.setAirplaneMode(true)
                      else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_AIRPLANE_MODE_SETTINGS)
                  })
                  row5.addView(circleTile("rotation", rotOn, Color.parseColor("#2563EB")) {
                      rotOn = !rotOn
                      if (prefs.useShizuku) ShizukuBridge.setAutoRotate(rotOn)
                      else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_DISPLAY_SETTINGS)
                      hideNow()
                      show()
                  })
                  row5.addView(circleTile("dnd", false, Color.WHITE) {
                      hideNow()
                  })
                  row5.addView(circleTile("hotspot", hotspotOn, Color.WHITE) {
                      hotspotOn = !hotspotOn
                      if (prefs.useShizuku) ShizukuBridge.setHotspot(hotspotOn)
                      ShizukuBridge.openSettingsFallback(context, "android.settings.TETHER_SETTINGS")
                  })
                  col.addView(row5)

                  val row6 = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = (14 * dp).toInt() }
                  }
                  row6.addView(circleTile("shazam", false, Color.WHITE) {
                      try {
                          val i = context.packageManager.getLaunchIntentForPackage("com.shazam.android")
                              ?: Intent(Intent.ACTION_VIEW, Uri.parse("https://www.shazam.com/"))
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i)
                      } catch (_: Throwable) {
                      }
                  })
                  row6.addView(circleTile("lock", false, Color.WHITE) {
                      hideNow()
                      val svc = CCService.instance
                      if (svc != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          svc.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN)
                      } else if (prefs.useShizuku) {
                          ShizukuBridge.runShellCommand("input keyevent 26")
                      }
                  })
                  row6.addView(circleTile("dolby", false, Color.WHITE) {
                      ShizukuBridge.openSettingsFallback(context, Settings.ACTION_DISPLAY_SETTINGS)
                  })
                  row6.addView(circleTile("device_controls", false, Color.WHITE) {
                      try {
                          val i = Intent("android.service.controls.action.CONTROLS_PROVIDER_SELECTOR")
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i)
                      } catch (_: Throwable) {
                          ShizukuBridge.openSettingsFallback(context, Settings.ACTION_SETTINGS)
                      }
                  })
                  col.addView(row6)

                  scroll.addView(col)
                  backdrop.addView(scroll)
                  return backdrop
              }
          }
