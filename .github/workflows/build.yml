                          .apply { leftMargin = (12 * dp).toInt() }
                  }
                  dataCard.addView(dataIcon)
                  dataCard.addView(dataTitle)
                  dataCard.setOnClickListener {
                      dataOn = !dataOn
                      if (prefs.useShizuku) ShizukuBridge.setMobileDataEnabled(dataOn)
                      else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_DATA_ROAMING_SETTINGS)
                      dataCard.background = glassPill(dataOn, light, 999f)
                      dataIcon.setTint(if (dataOn) Color.parseColor("#0F172A") else Color.WHITE)
                      dataTitle.setTextColor(if (dataOn) Color.parseColor("#0F172A") else Color.WHITE)
