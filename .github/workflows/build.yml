          package app.cc

          import android.accessibilityservice.AccessibilityService
          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          @SuppressLint("AccessibilityPolicy")
          class CCService : AccessibilityService() {

              companion object {
                  var instance: CCService? = null
              }

              private var panel: Panel? = null
              private var triggerView: View? = null
              private var downX = 0f
              private var downY = 0f

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  panel = Panel(this)
                  addTrigger()
              }

              private fun addTrigger() {
                  removeTrigger()
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val dp = resources.displayMetrics.density

                  val v = View(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnTouchListener { _, event ->
                          when (event.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  downX = event.rawX
                                  downY = event.rawY
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dy = event.rawY - downY
                                  val dx = kotlin.math.abs(event.rawX - downX)
                                  if (dy > 24 * dp && dy > dx) {
                                      panel?.show()
                                      true
                                  } else {
                                      false
                                  }
                              }
                              else -> false
                          }
                      }
                  }

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val lp = WindowManager.LayoutParams(
                      (72 * dp).toInt(),
                      (26 * dp).toInt(),
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                  }

                  try {
                      wm.addView(v, lp)
                      triggerView = v
                  } catch (_: Throwable) {
                  }
              }

              private fun removeTrigger() {
                  val v = triggerView ?: return
                  triggerView = null
                  try {
                      (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(v)
                  } catch (_: Throwable) {
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Keep overlay persistent across app switches unless explicitly closed by user
              }

              override fun onInterrupt() {
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  panel?.hideNow()
                  addTrigger()
              }

              override fun onDestroy() {
                  removeTrigger()
                  panel?.hideNow()
                  instance = null
                  super.onDestroy()
              }
          }
