                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  if (Build.VERSION.SDK_INT >= 31) {
                      lp.flags = lp.flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                      lp.blurBehindRadius = 80
                  }

                  try {
                      wm.addView(r, lp)
                  } catch (t: Throwable) {
                      return
                  }
                  root = r
                  content = box
                  shownAt = SystemClock.uptimeMillis()

                  try {
                      cam.registerTorchCallback(torchCb, h)
                  } catch (t: Throwable) {
                  }
                  refresh()

                  box.alpha = 0f
                  box.scaleX = 0.92f
                  box.scaleY = 0.92f
                  box.translationY = -svc.dpf(24f)
                  animDim(r, 0, 0x66, 260)
                  box.post {
                      box.pivotX = box.width * 0.85f
                      box.pivotY = 0f
                      box.animate().alpha(1f).scaleX(1f).scaleY(1f).translationY(0f)
                          .setDuration(380).setInterpolator(OvershootInterpolator(0.8f)).start()
                  }
              }

              fun hide() {
                  val r = root ?: return
                  root = null
                  stopTorch()
                  animDim(r, 0x66, 0, 180)
                  val c = content
                  if (c != null) {
                      c.animate().alpha(0f).scaleX(0.95f).scaleY(0.95f).translationY(-svc.dpf(14f))
                          .setDuration(170).withEndAction { remove(r) }.start()
                  } else {
                      remove(r)
                  }
              }

              fun hideNow() {
                  val r = root ?: return
                  root = null
                  stopTorch()
                  dim?.cancel()
                  content?.animate()?.cancel()
                  remove(r)
              }

              fun hideIfStale() {
                  if (root != null && SystemClock.uptimeMillis() - shownAt > 900) hide()
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/Sh.kt <<'__EOF__'
          package app.cc

          import android.content.pm.PackageManager
          import android.util.Log
          import rikka.shizuku.Shizuku

          object Sh {
              fun running(): Boolean = try {
                  Shizuku.pingBinder()
              } catch (t: Throwable) {
                  false
              }

              fun ready(): Boolean = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (t: Throwable) {
                  false
              }

              fun run(cmd: String) {
                  Thread {
                      try {
                          val m = Shizuku::class.java.getDeclaredMethod(
                              "newProcess",
                              Array<String>::class.java,
                              Array<String>::class.java,
                              String::class.java
                          )
                          m.isAccessible = true
                          val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                          p.waitFor()
                      } catch (t: Throwable) {
                          Log.e("CC", "shell failed: $cmd", t)
                      }
                  }.start()
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/Widgets.kt <<'__EOF__'
          package app.cc

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.OvershootInterpolator

          fun Context.dpf(v: Float): Float = v * resources.displayMetrics.density
          fun Context.dpi(v: Float): Int = (v * resources.displayMetrics.density + 0.5f).toInt()

          fun Context.statusBarH(): Int {
              val id = resources.getIdentifier("status_bar_height", "dimen", "android")
              return if (id > 0) resources.getDimensionPixelSize(id) else dpi(28f)
          }

          fun glass(ctx: Context, radius: Float, light: Boolean = false): GradientDrawable = GradientDrawable().apply {
              cornerRadius = radius
              setColor(if (light) 0x88FFFFFF.toInt() else 0x38FFFFFF)
              setStroke(ctx.dpi(1f), if (light) 0x55000000 else 0x59FFFFFF)
          }

          fun View.bump() {
              animate().cancel()
              animate().scaleX(0.92f).scaleY(0.92f).setDuration(80).withEndAction {
                  animate().scaleX(1f).scaleY(1f).setDuration(260)
                      .setInterpolator(OvershootInterpolator(3f)).start()
              }.start()
          }

          class Btn(
              ctx: Context,
              private val kind: Int,
              private val onColor: Int,
              private val round: Boolean,
              private val onIcon: Int = Color.WHITE,
              private val toggle: Boolean = true,
              private val light: Boolean = false
          ) : View(ctx) {

              var on = false
                  set(v) {
                      field = v
                      invalidate()
                  }

              var onTap: ((Boolean) -> Unit)? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  isClickable = true
                  setOnClickListener {
                      if (toggle) on = !on
                      bump()
                      onTap?.invoke(if (toggle) on else true)
                  }
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = minOf(w, h)
                  p.color = if (on) onColor else if (light) 0x66FFFFFF else 0x4DFFFFFF
                  if (round) {
                      c.drawCircle(w / 2f, h / 2f, d / 2f, p)
                  } else {
                      c.drawRoundRect(0f, 0f, w, h, d * 0.3f, d * 0.3f, p)
                  }
                  val sz = d * 0.5f
                  c.save()
                  c.translate((w - sz) / 2f, (h - sz) / 2f)
                  val offTint = if (light) 0xFF1F2937.toInt() else Color.WHITE
                  Ic.draw(c, kind, sz, if (on) onIcon else offTint)
                  c.restore()
              }
          }

          class IconBtn(ctx: Context, kind0: Int, private val light: Boolean = false) : View(ctx) {
              var kind: Int = kind0
                  set(v) {
                      field = v
                      invalidate()
                  }

              init {
                  isClickable = true
              }

              fun tap(a: () -> Unit) {
                  setOnClickListener {
                      bump()
                      a()
                  }
              }

              override fun onDraw(c: Canvas) {
                  val sz = minOf(width, height) * 0.6f
                  c.save()
                  c.translate((width - sz) / 2f, (height - sz) / 2f)
                  Ic.draw(c, kind, sz, if (light) 0xFF111827.toInt() else Color.WHITE)
                  c.restore()
              }
          }

          class VSlider(ctx: Context, private val kind: Int, private val light: Boolean = false) : View(ctx) {
              var value = 0.5f
                  set(v) {
                      field = v.coerceIn(0f, 1f)
                      invalidate()
                  }

              var onChange: ((Float, Boolean) -> Unit)? = null

              private val track = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = if (light) 0x66FFFFFF else 0x40FFFFFF
              }
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = if (light) 0xF2111827.toInt() else 0xF2FFFFFF.toInt()
              }
              private val clip = Path()
              private val box = RectF()

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val r = w * 0.36f
                  box.set(0f, 0f, w, h)
                  c.drawRoundRect(box, r, r, track)
                  c.save()
                  clip.reset()
                  clip.addRoundRect(box, r, r, Path.Direction.CW)
                  c.clipPath(clip)
                  c.drawRect(0f, h * (1f - value), w, h, fillP)
                  c.restore()
                  val sz = w * 0.42f
                  val color = if (value > 0.14f) {
                      if (light) Color.WHITE else 0xFF77777D.toInt()
                  } else {
                      if (light) 0xFF111827.toInt() else 0xE6FFFFFF.toInt()
                  }
                  c.save()
                  c.translate((w - sz) / 2f, h - sz - w * 0.22f)
                  Ic.draw(c, kind, sz, color)
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  parent?.requestDisallowInterceptTouchEvent(true)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          value = 1f - e.y / height
                          onChange?.invoke(value, false)
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          value = 1f - e.y / height
                          onChange?.invoke(value, true)
                      }
                  }
                  return true
              }
          }
          __EOF__

