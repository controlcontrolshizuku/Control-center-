                      Ic.BT -> Quad(blue, true, Color.WHITE, true)
                      Ic.ROT -> Quad(red, false, Color.WHITE, true)
                      Ic.MOON -> Quad(purple, false, Color.WHITE, true)
                      Ic.TORCH -> Quad(Color.WHITE, false, dark, true)
                      Ic.LOCK -> Quad(Color.WHITE, false, dark, false)
