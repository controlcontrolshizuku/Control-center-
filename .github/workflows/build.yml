              private fun buildCustomizeTab(light: Boolean) {
                  val tilesCard = makeCard(light)
                  tilesCard.addView(sectionTitle("أزرار الكنترول سنتر (إظهار وترتيب)", light))

                  val enabled = Prefs.getTiles(this)
                  val ordered = enabled + Prefs.ALL_TILES.filter { it !in enabled }

                  ordered.forEach { kind ->
                      val isOn = kind in enabled
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dpi(4f), 0, dpi(4f))
                      }

                      val nameTv = TextView(this).apply {
                          text = (if (isOn) "✅ " else "⬜ ") + Prefs.tileLabel(kind)
                          textSize = 15f
                          setTextColor(if (light) 0xFF111827.toInt() else Color.WHITE)
                      }
                      row.addView(nameTv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                      val upBtn = Button(this).apply {
                          text = "↑"
                          isEnabled = isOn
                          setOnClickListener {
                              Prefs.moveTile(this@MainActivity, kind, -1)
                              CCService.instance?.reloadPanel()
                              renderBody()
                          }
                      }
                      val downBtn = Button(this).apply {
                          text = "↓"
                          isEnabled = isOn
                          setOnClickListener {
                              Prefs.moveTile(this@MainActivity, kind, 1)
                              CCService.instance?.reloadPanel()
                              renderBody()
                          }
                      }
                      val toggleBtn = Button(this).apply {
                          text = if (isOn) "إخفاء" else "إضافة"
                          setOnClickListener {
                              Prefs.toggleTile(this@MainActivity, kind)
                              CCService.instance?.reloadPanel()
                              renderBody()
                          }
                      }

                      row.addView(upBtn, LinearLayout.LayoutParams(dpi(48f), ViewGroup.LayoutParams.WRAP_CONTENT))
                      row.addView(downBtn, LinearLayout.LayoutParams(dpi(48f), ViewGroup.LayoutParams.WRAP_CONTENT))
                      row.addView(toggleBtn)
                      tilesCard.addView(row)
                  }
                  bodyContainer.addView(tilesCard)

                  val appsCard = makeCard(light)
                  appsCard.addView(sectionTitle("إضافة تطبيقات داخل الكنترول سنتر", light))

                  val pinned = Prefs.getPinnedApps(this)
                  val addAppBtn = Button(this).apply {
                      text = "+ اختيار تطبيقات لإضافتها"
                      setOnClickListener { openAppPickerDialog() }
                  }
                  appsCard.addView(addAppBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dpi(8f)
                  })

                  if (pinned.isEmpty()) {
                      val emptyTv = TextView(this).apply {
                          text = "لم تضف تطبيقات بعد. اضغط على الزر بالأعلى لإضافة تطبيقاتك المفضلة."
                          textSize = 13f
                          setTextColor(if (light) 0xFF4B5563.toInt() else 0xFF9CA3AF.toInt())
                      }
                      appsCard.addView(emptyTv)
