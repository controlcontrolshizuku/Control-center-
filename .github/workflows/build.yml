          mkdir -p app/src/main/java/app/cc
          cat > app/src/main/java/app/cc/Sh.kt <<'__EOF__'
          package app.cc

          import android.content.pm.PackageManager
          import android.util.Log
          import rikka.shizuku.Shizuku

          /** Runs shell commands (uid 2000) through Shizuku. */
          object Sh {
              fun running(): Boolean = try {
                  Shizuku.pingBinder()
              } catch (t: Throwable) {
                  false
              }

              fun ready(): Boolean = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (t: Throwable) {
                  false
              }

              fun run(cmd: String) {
                  Thread {
                      try {
                          // Shizuku.newProcess is private since API 13; reflection is the usual workaround.
                          val m = Shizuku::class.java.getDeclaredMethod(
                              "newProcess",
                              Array<String>::class.java,
                              Array<String>::class.java,
                              String::class.java
                          )
                          m.isAccessible = true
                          val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                          p.waitFor()
                      } catch (t: Throwable) {
                          Log.e("CC", "shell failed: $cmd", t)
                      }
                  }.start()
              }
          }
          __EOF__
          mkdir -p app/src/main/java/app/cc
          cat > app/src/main/java/app/cc/Widgets.kt <<'__EOF__'
          package app.cc

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.OvershootInterpolator

          fun Context.dpf(v: Float): Float = v * resources.displayMetrics.density
          fun Context.dpi(v: Float): Int = (v * resources.displayMetrics.density + 0.5f).toInt()

          fun Context.statusBarH(): Int {
              val id = resources.getIdentifier("status_bar_height", "dimen", "android")
              return if (id > 0) resources.getDimensionPixelSize(id) else dpi(28f)
          }

          /** Frosted-glass card background (the blur itself comes from the window). */
          fun glass(ctx: Context, radius: Float): GradientDrawable = GradientDrawable().apply {
              cornerRadius = radius
              setColor(0x38FFFFFF)
              setStroke(ctx.dpi(1f), 0x59FFFFFF)
          }

          fun View.bump() {
              animate().cancel()
              animate().scaleX(0.92f).scaleY(0.92f).setDuration(80).withEndAction {
                  animate().scaleX(1f).scaleY(1f).setDuration(260)
                      .setInterpolator(OvershootInterpolator(3f)).start()
              }.start()
          }

          /** Round (connectivity) or rounded-square (tile) toggle button. */
          class Btn(
              ctx: Context,
              private val kind: Int,
              private val onColor: Int,
              private val round: Boolean,
              private val onIcon: Int = Color.WHITE,
              private val toggle: Boolean = true
          ) : View(ctx) {

              var on = false
                  set(v) {
                      field = v
                      invalidate()
                  }

              var onTap: ((Boolean) -> Unit)? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  isClickable = true
                  setOnClickListener {
                      if (toggle) on = !on
                      bump()
                      onTap?.invoke(if (toggle) on else true)
                  }
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = minOf(w, h)
                  p.color = if (on) onColor else 0x4DFFFFFF
                  if (round) {
                      c.drawCircle(w / 2f, h / 2f, d / 2f, p)
                  } else {
                      c.drawRoundRect(0f, 0f, w, h, d * 0.3f, d * 0.3f, p)
                  }
                  val sz = d * 0.5f
                  c.save()
                  c.translate((w - sz) / 2f, (h - sz) / 2f)
                  Ic.draw(c, kind, sz, if (on) onIcon else Color.WHITE)
                  c.restore()
              }
          }

          /** Transparent icon-only button (media controls). */
          class IconBtn(ctx: Context, kind0: Int) : View(ctx) {
              var kind: Int = kind0
                  set(v) {
                      field = v
                      invalidate()
                  }

              init {
                  isClickable = true
              }

              fun tap(a: () -> Unit) {
                  setOnClickListener {
                      bump()
                      a()
                  }
              }

              override fun onDraw(c: Canvas) {
                  val sz = minOf(width, height) * 0.6f
                  c.save()
                  c.translate((width - sz) / 2f, (height - sz) / 2f)
                  Ic.draw(c, kind, sz, Color.WHITE)
                  c.restore()
              }
          }

          /** iOS-style vertical pill slider. */
          class VSlider(ctx: Context, private val kind: Int) : View(ctx) {
              var value = 0.5f
                  set(v) {
                      field = v.coerceIn(0f, 1f)
                      invalidate()
                  }

              /** (value, isFinal) */
              var onChange: ((Float, Boolean) -> Unit)? = null

              private val track = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x40FFFFFF }
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xF2FFFFFF.toInt() }
              private val clip = Path()
              private val box = RectF()

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val r = w * 0.36f
                  box.set(0f, 0f, w, h)
                  c.drawRoundRect(box, r, r, track)
                  c.save()
                  clip.reset()
                  clip.addRoundRect(box, r, r, Path.Direction.CW)
                  c.clipPath(clip)
                  c.drawRect(0f, h * (1f - value), w, h, fillP)
                  c.restore()
                  val sz = w * 0.42f
                  val color = if (value > 0.14f) 0xFF77777D.toInt() else 0xE6FFFFFF.toInt()
                  c.save()
                  c.translate((w - sz) / 2f, h - sz - w * 0.22f)
                  Ic.draw(c, kind, sz, color)
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  parent?.requestDisallowInterceptTouchEvent(true)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          value = 1f - e.y / height
                          onChange?.invoke(value, false)
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          value = 1f - e.y / height
                          onChange?.invoke(value, true)
                      }
                  }
                  return true
              }
          }
