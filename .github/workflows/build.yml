      - name: Apply Shizuku SDK integration
        run: |
          set -e
          python3 - <<'__PY__'
          from pathlib import Path

          gradle_path = Path("app/build.gradle.kts")
          g_txt = gradle_path.read_text(encoding="utf-8")
          shizuku_deps = '''    implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")'''
          if "dev.rikka.shizuku:api" not in g_txt and "dependencies {" in g_txt:
              g_txt = g_txt.replace("dependencies {\n", f"dependencies {{\n{shizuku_deps}\n", 1)
              gradle_path.write_text(g_txt, encoding="utf-8")

          manifest_path = Path("app/src/main/AndroidManifest.xml")
          m_txt = manifest_path.read_text(encoding="utf-8")
          provider_xml = '''        <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />'''
          if "rikka.shizuku.ShizukuProvider" not in m_txt and "</application>" in m_txt:
              m_txt = m_txt.replace("</application>", f"{provider_xml}\n    </application>", 1)
              manifest_path.write_text(m_txt, encoding="utf-8")

          Path("app/src/main/java/app/cc/ShizukuBridge.kt").write_text('''package app.cc

          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.provider.Settings
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object ShizukuBridge {
              private const val SHIZUKU_PKG = "moe.shizuku.privileged.api"
              private var binderReady = false

              private val binderReceivedListener = Shizuku.OnBinderReceivedListener {
                  binderReady = true
              }
              private val binderDeadListener = Shizuku.OnBinderDeadListener {
                  binderReady = false
              }

              fun init(context: Context) {
                  try {
                      Shizuku.addBinderReceivedListener(binderReceivedListener)
                      Shizuku.addBinderDeadListener(binderDeadListener)
                      if (Shizuku.pingBinder()) {
                          binderReady = true
                      }
                  } catch (_: Throwable) {
                  }
              }

              fun isShizukuInstalled(context: Context): Boolean {
                  return try {
                      context.packageManager.getPackageInfo(SHIZUKU_PKG, 0)
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun isServiceAvailable(): Boolean {
                  return try {
                      binderReady || Shizuku.pingBinder()
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun hasPermission(): Boolean {
                  if (!isServiceAvailable()) return false
                  return try {
                      if (Shizuku.isPreV11()) {
                          true
                      } else {
                          Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                      }
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun requestPermission(requestCode: Int = 1001): Boolean {
                  if (!isServiceAvailable()) return false
                  return try {
                      if (hasPermission()) return true
                      if (!Shizuku.isPreV11()) {
                          Shizuku.requestPermission(requestCode)
                      }
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun openShizukuOrGuide(context: Context) {
                  init(context)
                  if (isServiceAvailable() && !hasPermission()) {
                      requestPermission()
                  }
                  try {
                      val launch = context.packageManager.getLaunchIntentForPackage(SHIZUKU_PKG)
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(launch)
                          return
                      }
                  } catch (_: Throwable) {
                  }
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://shizuku.rikka.app/"))
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(intent)
                  } catch (_: Throwable) {
                  }
              }

              fun runShellCommand(cmd: String): Pair<Boolean, String> {
                  if (hasPermission()) {
                      try {
                          val method = Shizuku::class.java.getDeclaredMethod(
                              "newProcess",
                              Array<String>::class.java,
                              Array<String>::class.java,
                              String::class.java
                          )
                          method.isAccessible = true
                          @Suppress("UNCHECKED_CAST")
                          val proc = method.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                          val out = BufferedReader(InputStreamReader(proc.inputStream)).readText()
                          val err = BufferedReader(InputStreamReader(proc.errorStream)).readText()
                          val code = proc.waitFor()
                          if (code == 0) return true to out.trim()
                          return false to (err.ifBlank { out }).trim()
                      } catch (_: Throwable) {
                      }
                  }
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText()
                      val code = process.waitFor()
                      if (code == 0) true to out.trim()
                      else false to (err.ifBlank { out }).trim()
                  } catch (t: Throwable) {
                      false to (t.message ?: "Shell error")
                  }
              }

              fun setWifiEnabled(enable: Boolean): Boolean {
                  val arg = if (enable) "enable" else "disable"
                  return runShellCommand("svc wifi $arg").first
              }

              fun setMobileDataEnabled(enable: Boolean): Boolean {
                  val arg = if (enable) "enable" else "disable"
                  return runShellCommand("svc data $arg").first
              }

              fun setBluetoothEnabled(enable: Boolean): Boolean {
                  val cmd = if (enable) "cmd bluetooth_manager enable" else "cmd bluetooth_manager disable"
                  val r = runShellCommand(cmd)
                  if (r.first) return true
                  val alt = if (enable) "svc bluetooth enable" else "svc bluetooth disable"
                  return runShellCommand(alt).first
              }

              fun setAirplaneMode(enable: Boolean): Boolean {
                  val v = if (enable) 1 else 0
                  val s1 = runShellCommand("settings put global airplane_mode_on $v").first
                  val act = if (enable) "true" else "false"
                  val s2 = runShellCommand("cmd connectivity airplane-mode $act").first
                  return s1 || s2
              }

              fun setDarkMode(enable: Boolean): Boolean {
                  val mode = if (enable) 2 else 1
                  val r1 = runShellCommand("cmd uimode night $mode").first
                  val r2 = runShellCommand("settings put secure ui_night_mode $mode").first
                  return r1 || r2
              }

              fun setAutoRotate(autoRotate: Boolean): Boolean {
                  val v = if (autoRotate) 1 else 0
                  return runShellCommand("settings put system accelerometer_rotation $v").first
              }

              fun setZenMode(zenMode: Int): Boolean {
                  val r1 = runShellCommand("cmd notification set_zen_mode $zenMode").first
                  val r2 = runShellCommand("settings put global zen_mode $zenMode").first
                  return r1 || r2
              }

              fun setHotspot(enable: Boolean): Boolean {
                  val cmd = if (enable) "cmd wifi start-softap" else "cmd wifi stop-softap"
                  return runShellCommand(cmd).first
              }

              fun setRingerMode(context: Context, mode: Int): Boolean {
                  val shellOk = runShellCommand("cmd audio set-ringer-mode $mode").first
                  if (shellOk) return true
                  return try {
                      val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.ringerMode = mode
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun openSettingsFallback(context: Context, action: String) {
                  try {
                      val i = Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i)
                  } catch (_: Throwable) {
                      try {
                          val i = Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i)
                      } catch (_: Throwable) {
                      }
                  }
              }
          }
