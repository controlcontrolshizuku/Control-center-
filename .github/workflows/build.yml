name: Build Control Center APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create project files
        run: |
          set -e
          mkdir -p .github/workflows
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/app/cc
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > gradle/wrapper/gradle-wrapper.properties <<'__EOF__'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          __EOF__

          cat > gradlew <<'__EOF__'
          #!/usr/bin/env sh
          exec gradle "$@"
          __EOF__
          chmod +x gradlew

          cat > build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF__

          cat > gradle.properties <<'__EOF__'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          __EOF__

          cat > settings.gradle.kts <<'__EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ControlCenter"
          include(":app")
          __EOF__

          cat > app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.cc"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.cc"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-liquid-glass"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          __EOF__

          cat > app/proguard-rules.pro <<'__EOF__'
          -keep class app.cc.** { *; }
          __EOF__

          cat > app/src/main/res/values/strings.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Control Center</string>
              <string name="svc_desc">Displays the Liquid Glass Control Center panel over other apps and supports quick system actions.</string>
          </resources>
          __EOF__

          cat > app/src/main/res/xml/accessibility_config.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="false"
              android:canRetrieveWindowContent="false"
              android:description="@string/svc_desc"
              android:notificationTimeout="150"
              android:settingsActivity="app.cc.MainActivity" />
          __EOF__

          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CCService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          __EOF__

          cat > app/src/main/java/app/cc/Prefs.kt <<'__EOF__'
          package app.cc

          import android.content.Context
          import android.content.SharedPreferences

          class Prefs(context: Context) {
              private val sp: SharedPreferences =
                  context.getSharedPreferences("cc_liquid_glass_prefs", Context.MODE_PRIVATE)

              var lightTheme: Boolean
                  get() = sp.getBoolean("light_theme", false)
                  set(v) = sp.edit().putBoolean("light_theme", v).apply()

              var useShizuku: Boolean
                  get() = sp.getBoolean("use_shizuku", true)
                  set(v) = sp.edit().putBoolean("use_shizuku", v).apply()

              var activeTiles: List<String>
                  get() {
                      val raw = sp.getString("active_tiles", null)
                      return if (raw.isNullOrBlank()) defaultTiles()
                      else raw.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  }
                  set(v) = sp.edit().putString("active_tiles", v.distinct().joinToString(",")).apply()

              var customShortcuts: List<String>
                  get() {
                      val raw = sp.getString("custom_shortcuts", null)
                      return if (raw.isNullOrBlank()) emptyList()
                      else raw.split("|").map { it.trim() }.filter { it.isNotEmpty() }
                  }
                  set(v) = sp.edit().putString("custom_shortcuts", v.distinct().joinToString("|")).apply()

              fun allAvailableTiles(): List<String> = listOf(
                  "wifi",
                  "data",
                  "bluetooth",
                  "torch",
                  "silent",
                  "vibrate",
                  "airplane",
                  "rotation",
                  "hotspot",
                  "dnd",
                  "dark_mode",
                  "lock",
                  "shazam",
                  "dolby",
                  "device_controls"
              ) + customShortcuts

              fun defaultTiles(): List<String> = listOf(
                  "wifi",
                  "data",
                  "bluetooth",
                  "torch",
                  "silent",
                  "airplane",
                  "rotation",
                  "hotspot",
                  "dnd",
                  "dark_mode",
                  "lock",
                  "shazam",
                  "dolby",
                  "device_controls"
              )

              fun labelFor(key: String): String = when (key) {
                  "wifi" -> "Wi-Fi"
                  "data" -> "Mobile Data"
                  "bluetooth" -> "Bluetooth"
                  "torch" -> "Torch"
                  "silent" -> "Silent"
                  "vibrate" -> "Vibrate"
                  "airplane" -> "Airplane"
                  "rotation" -> "Rotation Lock"
                  "hotspot" -> "Hotspot"
                  "dnd" -> "Do Not Disturb"
                  "dark_mode" -> "Dark Mode"
                  "lock" -> "Lock Screen"
                  "shazam" -> "Shazam"
                  "dolby" -> "Dolby Atmos"
                  "device_controls" -> "Device Controls"
                  else -> {
                      val parts = key.split("::", limit = 2)
                      if (parts.size == 2) parts[0] else key
                  }
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/ShizukuBridge.kt <<'__EOF__'
          package app.cc

          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.net.Uri
          import android.provider.Settings
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object ShizukuBridge {
              private const val SHIZUKU_PKG = "moe.shizuku.privileged.api"

              fun isShizukuInstalled(context: Context): Boolean {
                  return try {
                      context.packageManager.getPackageInfo(SHIZUKU_PKG, 0)
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun openShizukuOrGuide(context: Context) {
                  try {
                      val launch = context.packageManager.getLaunchIntentForPackage(SHIZUKU_PKG)
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(launch)
                          return
                      }
                  } catch (_: Throwable) {
                  }
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://shizuku.rikka.app/"))
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(intent)
                  } catch (_: Throwable) {
                  }
              }

              fun runShellCommand(cmd: String): Pair<Boolean, String> {
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText()
                      val code = process.waitFor()
                      if (code == 0) true to out.trim()
                      else false to (err.ifBlank { out }).trim()
                  } catch (t: Throwable) {
                      false to (t.message ?: "Shell error")
                  }
              }

              fun setWifiEnabled(enable: Boolean): Boolean {
                  val arg = if (enable) "enable" else "disable"
                  return runShellCommand("svc wifi $arg").first
              }

              fun setMobileDataEnabled(enable: Boolean): Boolean {
                  val arg = if (enable) "enable" else "disable"
                  return runShellCommand("svc data $arg").first
              }

              fun setBluetoothEnabled(enable: Boolean): Boolean {
                  val cmd = if (enable) "cmd bluetooth_manager enable" else "cmd bluetooth_manager disable"
                  val r = runShellCommand(cmd)
                  if (r.first) return true
                  val alt = if (enable) "svc bluetooth enable" else "svc bluetooth disable"
                  return runShellCommand(alt).first
              }

              fun setAirplaneMode(enable: Boolean): Boolean {
                  val v = if (enable) 1 else 0
                  val s1 = runShellCommand("settings put global airplane_mode_on $v").first
                  val act = if (enable) "true" else "false"
                  val s2 = runShellCommand("cmd connectivity airplane-mode $act").first
                  return s1 || s2
              }

              fun setDarkMode(enable: Boolean): Boolean {
                  val mode = if (enable) 2 else 1
                  val r1 = runShellCommand("cmd uimode night $mode").first
                  val r2 = runShellCommand("settings put secure ui_night_mode $mode").first
                  return r1 || r2
              }

              fun setAutoRotate(autoRotate: Boolean): Boolean {
                  val v = if (autoRotate) 1 else 0
                  return runShellCommand("settings put system accelerometer_rotation $v").first
              }

              fun setZenMode(zenMode: Int): Boolean {
                  val r1 = runShellCommand("cmd notification set_zen_mode $zenMode").first
                  val r2 = runShellCommand("settings put global zen_mode $zenMode").first
                  return r1 || r2
              }

              fun setHotspot(enable: Boolean): Boolean {
                  val cmd = if (enable) "cmd wifi start-softap" else "cmd wifi stop-softap"
                  return runShellCommand(cmd).first
              }

              fun setRingerMode(context: Context, mode: Int): Boolean {
                  val shellOk = runShellCommand("cmd audio set-ringer-mode $mode").first
                  if (shellOk) return true
                  return try {
                      val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.ringerMode = mode
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun openSettingsFallback(context: Context, action: String) {
                  try {
                      val i = Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i)
                  } catch (_: Throwable) {
                      try {
                          val i = Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i)
                      } catch (_: Throwable) {
                      }
                  }
              }
          }
          __EOF__

          cat > app/src/main/java/app/cc/Ic.kt <<'__EOF__'
          package app.cc

          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF

          object Ic {
              fun draw(c: Canvas, kind: String, size: Float, color: Int) {
                  val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      this.color = color
                      style = Paint.Style.STROKE
                      strokeWidth = (size * 0.105f).coerceAtLeast(2.2f)
                      strokeCap = Paint.Cap.ROUND
                      strokeJoin = Paint.Join.ROUND
                  }
                  val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      this.color = color
                      style = Paint.Style.FILL
                  }

                  val cx = size * 0.5f
                  val cy = size * 0.5f
                  val r = size * 0.34f

                  when (kind) {
                      "wifi" -> {
                          c.drawArc(RectF(cx - r, cy - r * 0.65f, cx + r, cy + r * 0.95f), 215f, 110f, false, p)
                          c.drawArc(RectF(cx - r * 0.65f, cy - r * 0.3f, cx + r * 0.65f, cy + r * 0.9f), 220f, 100f, false, p)
                          c.drawCircle(cx, cy + r * 0.65f, size * 0.06f, fill)
                      }
                      "data" -> {
                          c.drawLine(cx - r * 0.35f, cy + r * 0.75f, cx - r * 0.35f, cy - r * 0.65f, p)
                          c.drawLine(cx - r * 0.7f, cy - r * 0.3f, cx - r * 0.35f, cy - r * 0.65f, p)
                          c.drawLine(cx - r * 0.35f, cy - r * 0.65f, cx, cy - r * 0.3f, p)

                          c.drawLine(cx + r * 0.35f, cy - r * 0.75f, cx + r * 0.35f, cy + r * 0.65f, p)
                          c.drawLine(cx, cy + r * 0.3f, cx + r * 0.35f, cy + r * 0.65f, p)
                          c.drawLine(cx + r * 0.35f, cy + r * 0.65f, cx + r * 0.7f, cy + r * 0.3f, p)
                      }
                      "bluetooth" -> {
                          c.drawLine(cx, cy - r * 0.85f, cx, cy + r * 0.85f, p)
                          c.drawLine(cx, cy - r * 0.85f, cx + r * 0.55f, cy - r * 0.35f, p)
                          c.drawLine(cx + r * 0.55f, cy - r * 0.35f, cx - r * 0.55f, cy + r * 0.45f, p)
                          c.drawLine(cx, cy + r * 0.85f, cx + r * 0.55f, cy + r * 0.35f, p)
                          c.drawLine(cx + r * 0.55f, cy + r * 0.35f, cx - r * 0.55f, cy - r * 0.45f, p)
                      }
                      "torch" -> {
                          c.drawRoundRect(RectF(cx - r * 0.4f, cy - r * 0.75f, cx + r * 0.4f, cy - r * 0.1f), 4f, 4f, p)
                          c.drawLine(cx - r * 0.4f, cy - r * 0.1f, cx - r * 0.25f, cy + r * 0.15f, p)
                          c.drawLine(cx + r * 0.4f, cy - r * 0.1f, cx + r * 0.25f, cy + r * 0.15f, p)
                          c.drawRect(RectF(cx - r * 0.25f, cy + r * 0.15f, cx + r * 0.25f, cy + r * 0.8f), p)
                          c.drawCircle(cx, cy - r * 0.42f, size * 0.05f, fill)
                      }
                      "silent" -> {
                          c.drawPath(Path().apply {
                              moveTo(cx - r * 0.55f, cy - r * 0.25f)
                              lineTo(cx - r * 0.15f, cy - r * 0.25f)
                              lineTo(cx + r * 0.35f, cy - r * 0.65f)
                              lineTo(cx + r * 0.35f, cy + r * 0.65f)
                              lineTo(cx - r * 0.15f, cy + r * 0.25f)
                              lineTo(cx - r * 0.55f, cy + r * 0.25f)
                              close()
                          }, p)
                          c.drawLine(cx + r * 0.45f, cy - r * 0.45f, cx + r * 0.9f, cy + r * 0.45f, p)
                          c.drawLine(cx + r * 0.9f, cy - r * 0.45f, cx + r * 0.45f, cy + r * 0.45f, p)
                      }
                      "vibrate" -> {
                          c.drawRoundRect(RectF(cx - r * 0.25f, cy - r * 0.7f, cx + r * 0.25f, cy + r * 0.7f), 6f, 6f, p)
                          c.drawLine(cx - r * 0.6f, cy - r * 0.35f, cx - r * 0.45f, cy, p)
                          c.drawLine(cx - r * 0.45f, cy, cx - r * 0.6f, cy + r * 0.35f, p)
                          c.drawLine(cx + r * 0.6f, cy - r * 0.35f, cx + r * 0.45f, cy, p)
                          c.drawLine(cx + r * 0.45f, cy, cx + r * 0.6f, cy + r * 0.35f, p)
                      }
                      "airplane" -> {
                          c.drawLine(cx - r * 0.8f, cy + r * 0.15f, cx + r * 0.8f, cy - r * 0.2f, p)
                          c.drawLine(cx - r * 0.15f, cy, cx - r * 0.55f, cy - r * 0.65f, p)
                          c.drawLine(cx + r * 0.1f, cy - r * 0.05f, cx - r * 0.25f, cy + r * 0.65f, p)
                      }
                      "rotation" -> {
                          c.drawArc(RectF(cx - r * 0.75f, cy - r * 0.75f, cx + r * 0.75f, cy + r * 0.75f), 20f, 130f, false, p)
                          c.drawArc(RectF(cx - r * 0.75f, cy - r * 0.75f, cx + r * 0.75f, cy + r * 0.75f), 200f, 130f, false, p)
                      }
                      "hotspot" -> {
                          c.drawCircle(cx, cy, size * 0.08f, fill)
                          c.drawArc(RectF(cx - r * 0.45f, cy - r * 0.45f, cx + r * 0.45f, cy + r * 0.45f), 200f, 140f, false, p)
                          c.drawArc(RectF(cx - r * 0.8f, cy - r * 0.8f, cx + r * 0.8f, cy + r * 0.8f), 200f, 140f, false, p)
                      }
                      "dnd" -> {
                          c.drawCircle(cx, cy, r * 0.75f, p)
                          c.drawLine(cx - r * 0.4f, cy, cx + r * 0.4f, cy, p)
                      }
                      "dark_mode" -> {
                          c.drawArc(RectF(cx - r * 0.75f, cy - r * 0.75f, cx + r * 0.75f, cy + r * 0.75f), 50f, 250f, false, p)
                      }
                      "lock" -> {
                          c.drawRoundRect(RectF(cx - r * 0.55f, cy - r * 0.1f, cx + r * 0.55f, cy + r * 0.8f), 6f, 6f, p)
                          c.drawArc(RectF(cx - r * 0.35f, cy - r * 0.75f, cx + r * 0.35f, cy + r * 0.1f), 180f, 180f, false, p)
                      }
                      "brightness" -> {
                          c.drawCircle(cx, cy, r * 0.42f, fill)
                          for (i in 0 until 8) {
                              val ang = Math.toRadians((i * 45).toDouble())
                              val x1 = cx + (Math.cos(ang) * r * 0.62f).toFloat()
                              val y1 = cy + (Math.sin(ang) * r * 0.62f).toFloat()
                              val x2 = cx + (Math.cos(ang) * r * 0.88f).toFloat()
                              val y2 = cy + (Math.sin(ang) * r * 0.88f).toFloat()
                              c.drawLine(x1, y1, x2, y2, p)
                          }
                      }
                      "volume" -> {
                          c.drawPath(Path().apply {
                              moveTo(cx - r * 0.65f, cy - r * 0.25f)
                              lineTo(cx - r * 0.25f, cy - r * 0.25f)
                              lineTo(cx + r * 0.25f, cy - r * 0.7f)
                              lineTo(cx + r * 0.25f, cy + r * 0.7f)
                              lineTo(cx - r * 0.25f, cy + r * 0.25f)
                              lineTo(cx - r * 0.65f, cy + r * 0.25f)
                              close()
                          }, p)
                          c.drawArc(RectF(cx, cy - r * 0.5f, cx + r * 0.8f, cy + r * 0.5f), -55f, 110f, false, p)
                      }
                      "media" -> {
                          c.drawCircle(cx - r * 0.35f, cy + r * 0.45f, r * 0.25f, fill)
                          c.drawCircle(cx + r * 0.45f, cy + r * 0.3f, r * 0.25f, fill)
                          c.drawLine(cx - r * 0.1f, cy + r * 0.45f, cx - r * 0.1f, cy - r * 0.6f, p)
                          c.drawLine(cx + r * 0.7f, cy + r * 0.3f, cx + r * 0.7f, cy - r * 0.75f, p)
                          c.drawLine(cx - r * 0.1f, cy - r * 0.6f, cx + r * 0.7f, cy - r * 0.75f, p)
                      }
                      "shazam" -> {
                          c.drawCircle(cx - r * 0.25f, cy - r * 0.15f, r * 0.45f, p)
                          c.drawCircle(cx + r * 0.25f, cy + r * 0.15f, r * 0.45f, p)
                      }
                      "dolby" -> {
                          c.drawArc(RectF(cx - r * 0.85f, cy - r * 0.65f, cx - r * 0.05f, cy + r * 0.65f), -90f, 180f, false, p)
                          c.drawArc(RectF(cx + r * 0.05f, cy - r * 0.65f, cx + r * 0.85f, cy + r * 0.65f), 90f, 180f, false, p)
                      }
                      else -> {
                          c.drawRoundRect(RectF(cx - r * 0.75f, cy - r * 0.75f, cx + r * 0.75f, cy + r * 0.75f), 10f, 10f, p)
                          c.drawCircle(cx, cy, r * 0.25f, fill)
                      }
                  }
              }
          }
          __EOF__

                    cat > app/src/main/java/app/cc/Widgets.kt <<'__EOF__'
          package app.cc

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView

          object GlassStyle {
              fun cardBackground(active: Boolean, light: Boolean): GradientDrawable {
                  val bg = if (active) {
                      if (light) Color.parseColor("#E6FFFFFF") else Color.parseColor("#38FFFFFF")
                  } else {
                      if (light) Color.parseColor("#88FFFFFF") else Color.parseColor("#1AFFFFFF")
                  }
                  val stroke = if (active) {
                      if (light) Color.parseColor("#CCFFFFFF") else Color.parseColor("#88FFFFFF")
                  } else {
                      if (light) Color.parseColor("#66FFFFFF") else Color.parseColor("#38FFFFFF")
                  }
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = 46f
                      setColor(bg)
                      setStroke(2, stroke)
                  }
              }

              fun iconBubble(active: Boolean, light: Boolean): GradientDrawable {
                  val bg = if (active) {
                      if (light) Color.parseColor("#1D63FF") else Color.parseColor("#FFFFFF")
                  } else {
                      if (light) Color.parseColor("#33000000") else Color.parseColor("#24FFFFFF")
                  }
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(bg)
                  }
              }

              fun textColor(active: Boolean, light: Boolean): Int = when {
                  light && active -> Color.parseColor("#0F172A")
                  light && !active -> Color.parseColor("#1E293B")
                  !light && active -> Color.WHITE
                  else -> Color.parseColor("#DCE6F2")
              }

              fun iconTint(active: Boolean, light: Boolean): Int = when {
                  light && active -> Color.WHITE
                  light && !active -> Color.parseColor("#0F172A")
                  !light && active -> Color.parseColor("#0B1020")
                  else -> Color.WHITE
              }
          }

          class LiquidIconView(
              context: Context,
              private val kind: String,
              private val active: Boolean,
              private val light: Boolean
          ) : View(context) {
              private val bubble = GlassStyle.iconBubble(active, light)
              private val tint = GlassStyle.iconTint(active, light)

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val d = (40 * resources.displayMetrics.density).toInt()
                  setMeasuredDimension(d, d)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  bubble.setBounds(0, 0, width, height)
                  bubble.draw(canvas)
                  val pad = width * 0.22f
                  canvas.save()
                  canvas.translate(pad, pad)
                  Ic.draw(canvas, kind, width - pad * 2f, tint)
                  canvas.restore()
              }
          }

          class LiquidTileView(
              context: Context,
              val key: String,
              val title: String,
              var active: Boolean,
              var light: Boolean
          ) : LinearLayout(context) {

              private val labelView = TextView(context).apply {
                  text = title
                  textSize = 12.5f
                  maxLines = 1
                  setTextColor(GlassStyle.textColor(active, light))
              }

              init {
                  orientation = HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
                  val px = (12 * resources.displayMetrics.density).toInt()
                  val py = (10 * resources.displayMetrics.density).toInt()
                  setPadding(px, py, px, py)
                  background = GlassStyle.cardBackground(active, light)
                  rebuildChildren()
              }

              fun refreshState(newActive: Boolean, newLight: Boolean) {
                  active = newActive
                  light = newLight
                  background = GlassStyle.cardBackground(active, light)
                  labelView.setTextColor(GlassStyle.textColor(active, light))
                  rebuildChildren()
              }

              private fun rebuildChildren() {
                  removeAllViews()
                  addView(LiquidIconView(context, iconKind(key), active, light))
                  addView(View(context).apply {
                      layoutParams = LayoutParams((8 * resources.displayMetrics.density).toInt(), 1)
                  })
                  addView(labelView)
              }

              companion object {
                  fun iconKind(key: String): String = when {
                      key.startsWith("custom::") -> "shortcut"
                      key == "device_controls" -> "controls"
                      else -> key
                  }
              }
          }

          class VerticalGlassSlider(
              context: Context,
              private val kind: String,
              private val light: Boolean,
              private val onLevelChanged: (Float, Boolean) -> Unit
          ) : View(context) {

              private var level = 0.5f
              private val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = if (light) Color.parseColor("#66FFFFFF") else Color.parseColor("#24FFFFFF")
              }
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = if (light) Color.parseColor("#F0FFFFFF") else Color.parseColor("#E6FFFFFF")
              }
              private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2f
                  color = if (light) Color.parseColor("#B3FFFFFF") else Color.parseColor("#55FFFFFF")
              }
              private val clipPath = Path()
              private val boundsRect = RectF()

              fun setLevel(v: Float) {
                  level = v.coerceIn(0f, 1f)
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val r = w * 0.36f
                  boundsRect.set(0f, 0f, w, h)

                  canvas.drawRoundRect(boundsRect, r, r, trackPaint)

                  canvas.save()
                  clipPath.reset()
                  clipPath.addRoundRect(boundsRect, r, r, Path.Direction.CW)
                  canvas.clipPath(clipPath)
                  canvas.drawRect(0f, h * (1f - level), w, h, fillPaint)
                  canvas.restore()

                  canvas.drawRoundRect(boundsRect, r, r, borderPaint)

                  val icSize = w * 0.42f
                  val icColor = if (level > 0.25f) Color.parseColor("#0F172A") else Color.WHITE
                  canvas.save()
                  canvas.translate((w - icSize) / 2f, h - icSize - w * 0.24f)
                  Ic.draw(canvas, kind, icSize, icColor)
                  canvas.restore()
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  parent?.requestDisallowInterceptTouchEvent(true)
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          level = (1f - (event.y / height.coerceAtLeast(1).toFloat())).coerceIn(0f, 1f)
                          invalidate()
                          onLevelChanged(level, false)
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          level = (1f - (event.y / height.coerceAtLeast(1).toFloat())).coerceIn(0f, 1f)
                          invalidate()
                          onLevelChanged(level, true)
                      }
                  }
                  return true
              }
          }
