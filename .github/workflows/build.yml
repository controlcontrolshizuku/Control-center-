          package app.cc

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class Panel(private val context: Context) {
              private val prefs = Prefs(context)
              private val wm = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private var overlayView: View? = null
              private var torchOn = false
              private var dndOn = false
              private var hotspotOn = false

              fun isShowing(): Boolean = overlayView != null

              fun toggle() {
                  if (isShowing()) hideNow() else show()
              }

              fun hideNow() {
                  val v = overlayView ?: return
                  overlayView = null
                  try {
                      wm.removeView(v)
                  } catch (_: Throwable) {
                  }
              }

              fun show() {
                  if (isShowing()) return
                  if (!Settings.canDrawOverlays(context)) {
                      Toast.makeText(context, "فعّل إذن الظهور فوق التطبيقات أولاً", Toast.LENGTH_SHORT).show()
                      try {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:${context.packageName}")
                          ).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                      } catch (_: Throwable) {
                      }
                      return
                  }

                  val light = prefs.lightTheme
                  val container = buildPanelView(light)

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  }

                  try {
                      wm.addView(container, params)
                      overlayView = container
                  } catch (t: Throwable) {
                      Toast.makeText(context, "تعذر فتح اللوحة: ${t.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun buildPanelView(light: Boolean): View {
                  val dp = context.resources.displayMetrics.density
                  val root = FrameLayout(context).apply {
                      setPadding((12 * dp).toInt(), (36 * dp).toInt(), (12 * dp).toInt(), (16 * dp).toInt())
                  }

                  val shell = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((14 * dp).toInt(), (14 * dp).toInt(), (14 * dp).toInt(), (14 * dp).toInt())
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 64f
                          setColor(if (light) Color.parseColor("#B8EAF2FF") else Color.parseColor("#C40B1220"))
                          setStroke(2, if (light) Color.parseColor("#CCFFFFFF") else Color.parseColor("#44FFFFFF"))
                      }
                  }

                  val header = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val title = TextView(context).apply {
                      text = "Liquid Glass Control"
                      textSize = 16f
                      setTextColor(if (light) Color.parseColor("#0F172A") else Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val btnTheme = Button(context).apply {
                      text = if (light) "Dark" else "Light"
                      setOnClickListener {
                          prefs.lightTheme = !prefs.lightTheme
                          hideNow()
                          show()
                      }
                  }

                  val btnClose = Button(context).apply {
                      text = "Close"
                      setOnClickListener { hideNow() }
                  }

                  header.addView(title)
                  header.addView(btnTheme)
                  header.addView(btnClose)
                  shell.addView(header)

                  val topRow = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (150 * dp).toInt()
                      )
                      lp.topMargin = (10 * dp).toInt()
                      layoutParams = lp
                  }

                  val mediaCard = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding((12 * dp).toInt(), (10 * dp).toInt(), (12 * dp).toInt(), (10 * dp).toInt())
                      background = GlassStyle.cardBackground(active = false, light = light)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.4f)
                  }

                  val mediaLabel = TextView(context).apply {
                      text = "Media & Quick Actions"
                      textSize = 13f
                      setTextColor(GlassStyle.textColor(false, light))
                  }

                  val mediaControls = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.topMargin = (8 * dp).toInt()
                      layoutParams = lp
                  }

                  val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  val btnPrev = Button(context).apply {
                      text = "Prev"
                      setOnClickListener { sendMediaKey(am, KeyEvent.KEYCODE_MEDIA_PREVIOUS) }
                  }
                  val btnPlay = Button(context).apply {
                      text = "Play"
                      setOnClickListener { sendMediaKey(am, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) }
                  }
                  val btnNext = Button(context).apply {
                      text = "Next"
                      setOnClickListener { sendMediaKey(am, KeyEvent.KEYCODE_MEDIA_NEXT) }
                  }

                  mediaControls.addView(btnPrev)
                  mediaControls.addView(btnPlay)
                  mediaControls.addView(btnNext)
                  mediaCard.addView(mediaLabel)
                  mediaCard.addView(mediaControls)

                  val brightSlider = VerticalGlassSlider(context, "brightness", light) { valFloat, _ ->
                      setBrightness(valFloat)
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0.55f
                      ).apply { leftMargin = (8 * dp).toInt() }
                  }
                  brightSlider.setLevel(currentBrightness())

                  val volSlider = VerticalGlassSlider(context, "volume", light) { valFloat, _ ->
                      val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                      val target = (valFloat * max).toInt().coerceIn(0, max)
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, target, 0)
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0.55f
                      ).apply { leftMargin = (8 * dp).toInt() }
                  }
                  val curMax = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                  volSlider.setLevel(am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / curMax.toFloat())

                  topRow.addView(mediaCard)
                  topRow.addView(brightSlider)
                  topRow.addView(volSlider)
                  shell.addView(topRow)

                  val scroll = ScrollView(context).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (320 * dp).toInt()
                      ).apply { topMargin = (10 * dp).toInt() }
                  }

                  val grid = GridLayout(context).apply {
                      columnCount = 2
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val tiles = prefs.activeTiles
                  for (key in tiles) {
                      val isOn = initialStateFor(key, am)
                      val tile = LiquidTileView(context, key, prefs.labelFor(key), isOn, light).apply {
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0
                              height = GridLayout.LayoutParams.WRAP_CONTENT
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              setMargins((5 * dp).toInt(), (5 * dp).toInt(), (5 * dp).toInt(), (5 * dp).toInt())
                          }
                          setOnClickListener {
                              val nextState = handleTileClick(key, active, am)
                              refreshState(nextState, light)
                          }
                      }
                      grid.addView(tile)
                  }

                  scroll.addView(grid)
                  shell.addView(scroll)
                  root.addView(shell)
                  return root
              }

              private fun sendMediaKey(am: AudioManager, keyCode: Int) {
                  try {
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, keyCode))
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, keyCode))
                  } catch (_: Throwable) {
                  }
              }

              private fun currentBrightness(): Float {
                  return try {
                      val b = Settings.System.getInt(context.contentResolver, Settings.System.SCREEN_BRIGHTNESS)
                      (b / 255f).coerceIn(0.05f, 1f)
                  } catch (_: Throwable) {
                      0.5f
                  }
              }

              private fun setBrightness(v: Float) {
                  val target = (v * 255f).toInt().coerceIn(5, 255)
                  if (prefs.useShizuku) {
                      ShizukuBridge.runShellCommand("settings put system screen_brightness $target")
                  }
                  try {
                      Settings.System.putInt(context.contentResolver, Settings.System.SCREEN_BRIGHTNESS, target)
                  } catch (_: Throwable) {
                  }
              }

              private fun initialStateFor(key: String, am: AudioManager): Boolean = when (key) {
                  "torch" -> torchOn
                  "silent" -> am.ringerMode == AudioManager.RINGER_MODE_SILENT
                  "vibrate" -> am.ringerMode == AudioManager.RINGER_MODE_VIBRATE
                  "dnd" -> dndOn
                  "hotspot" -> hotspotOn
                  "dark_mode" -> prefs.lightTheme.not()
                  else -> false
              }

              private fun handleTileClick(key: String, currentActive: Boolean, am: AudioManager): Boolean {
                  val target = !currentActive
                  return when (key) {
                      "torch" -> toggleTorch(target)
                      "silent" -> {
                          if (prefs.useShizuku) ShizukuBridge.setRingerMode(context, AudioManager.RINGER_MODE_SILENT)
                          else am.ringerMode = AudioManager.RINGER_MODE_SILENT
                          true
                      }
                      "vibrate" -> {
                          if (prefs.useShizuku) ShizukuBridge.setRingerMode(context, AudioManager.RINGER_MODE_VIBRATE)
                          else am.ringerMode = AudioManager.RINGER_MODE_VIBRATE
                          true
                      }
                      "wifi" -> {
                          if (prefs.useShizuku && ShizukuBridge.setWifiEnabled(target)) target
                          else {
                              ShizukuBridge.openSettingsFallback(context, Settings.ACTION_WIFI_SETTINGS)
                              target
                          }
                      }
                      "data" -> {
                          if (prefs.useShizuku && ShizukuBridge.setMobileDataEnabled(target)) target
                          else {
                              ShizukuBridge.openSettingsFallback(context, Settings.ACTION_DATA_ROAMING_SETTINGS)
                              target
                          }
                      }
                      "bluetooth" -> {
                          if (prefs.useShizuku && ShizukuBridge.setBluetoothEnabled(target)) target
                          else {
                              ShizukuBridge.openSettingsFallback(context, Settings.ACTION_BLUETOOTH_SETTINGS)
                              target
                          }
                      }
                      "airplane" -> {
                          if (prefs.useShizuku && ShizukuBridge.setAirplaneMode(target)) target
                          else {
                              ShizukuBridge.openSettingsFallback(context, Settings.ACTION_AIRPLANE_MODE_SETTINGS)
                              target
                          }
                      }
                      "rotation" -> {
                          if (prefs.useShizuku && ShizukuBridge.setAutoRotate(!target)) target
                          else {
                              ShizukuBridge.openSettingsFallback(context, Settings.ACTION_DISPLAY_SETTINGS)
                              target
                          }
                      }
                      "hotspot" -> {
                          hotspotOn = target
                          if (prefs.useShizuku) ShizukuBridge.setHotspot(target)
                          ShizukuBridge.openSettingsFallback(context, "android.settings.TETHER_SETTINGS")
                          hotspotOn
                      }
                      "dnd" -> {
                          dndOn = target
                          if (prefs.useShizuku) ShizukuBridge.setZenMode(if (target) 2 else 0)
                          else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_ZEN_MODE_PRIORITY_SETTINGS)
                          dndOn
                      }
                      "dark_mode" -> {
                          if (prefs.useShizuku) ShizukuBridge.setDarkMode(target)
                          else ShizukuBridge.openSettingsFallback(context, Settings.ACTION_DISPLAY_SETTINGS)
                          target
                      }
                      "lock" -> {
                          hideNow()
                          val svc = CCService.instance
                          if (svc != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              svc.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN)
                          } else {
                              ShizukuBridge.runShellCommand("input keyevent 26")
                          }
                          false
                      }
                      "shazam" -> {
                          launchKnownOrSearch(
                              listOf("com.shazam.android", "com.shazam.encore.android"),
                              "https://www.shazam.com/"
                          )
                          false
                      }
                      "dolby" -> {
                          launchKnownOrSearch(
                              listOf("com.dolby.daxservice", "com.dolby.dolbyatmos", "com.motorola.dolby.dolbyui"),
                              null
                          )
                          false
                      }
                      "device_controls" -> {
                          try {
                              val i = Intent("android.service.controls.action.CONTROLS_PROVIDER_SELECTOR")
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(i)
                          } catch (_: Throwable) {
                              ShizukuBridge.openSettingsFallback(context, Settings.ACTION_SETTINGS)
                          }
                          false
                      }
                      else -> {
                          if (key.startsWith("custom::")) {
                              val pkg = key.removePrefix("custom::").substringAfter("::", "")
                              if (pkg.isNotEmpty()) launchPackage(pkg)
                          }
                          false
                      }
                  }
              }

              private fun toggleTorch(enable: Boolean): Boolean {
                  return try {
                      val cm = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val camId = cm.cameraIdList.firstOrNull { id ->
                          val chars = cm.getCameraCharacteristics(id)
                          val hasFlash = chars.get(android.hardware.camera2.CameraCharacteristics.FLASH_INFO_AVAILABLE) ?: false
                          val facing = chars.get(android.hardware.camera2.CameraCharacteristics.LENS_FACING)
                          hasFlash && facing == android.hardware.camera2.CameraCharacteristics.LENS_FACING_BACK
                      } ?: cm.cameraIdList.firstOrNull()

                      if (camId != null) {
                          cm.setTorchMode(camId, enable)
                          torchOn = enable
                          enable
                      } else {
                          false
                      }
                  } catch (_: Throwable) {
                      false
                  }
              }

              private fun launchKnownOrSearch(packages: List<String>, fallbackUrl: String?) {
                  for (pkg in packages) {
                      if (launchPackage(pkg)) return
                  }
                  if (fallbackUrl != null) {
                      try {
                          val i = Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i)
                          return
                      } catch (_: Throwable) {
                      }
                  }
                  Toast.makeText(context, "التطبيق غير مثبت على الجهاز", Toast.LENGTH_SHORT).show()
              }

              private fun launchPackage(pkg: String): Boolean {
                  return try {
                      val i = context.packageManager.getLaunchIntentForPackage(pkg)
                      if (i != null) {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i)
                          true
                      } else {
                          false
                      }
                  } catch (_: Throwable) {
                      false
                  }
              }
          }
