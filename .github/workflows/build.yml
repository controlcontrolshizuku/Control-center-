          from pathlib import Path

          Path("app/src/main/java/app/cc/Panel.kt").write_text('''package app.cc

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class Panel(private val context: Context) {
              private val prefs = Prefs(context)
              private val wm = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private var overlayView: View? = null
              private var torchOn = false
              private var dndOn = false
              private var hotspotOn = false

              fun isShowing(): Boolean = overlayView != null

              fun toggle() {
                  if (isShowing()) hideNow() else show()
              }

              fun hideNow() {
                  val v = overlayView ?: return
                  overlayView = null
                  try {
                      wm.removeView(v)
                  } catch (_: Throwable) {
                  }
              }

              fun show() {
                  if (isShowing()) return
                  ShizukuBridge.init(context)
                  if (!Settings.canDrawOverlays(context)) {
                      Toast.makeText(context, "فعّل إذن الظهور فوق التطبيقات أولاً", Toast.LENGTH_SHORT).show()
                      try {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:${context.packageName}")
                          ).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                      } catch (_: Throwable) {
                      }
                      return
                  }

                  val light = prefs.lightTheme
                  val container = buildPanelView(light)

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  }

                  try {
                      wm.addView(container, params)
                      overlayView = container
                  } catch (t: Throwable) {
                      Toast.makeText(context, "تعذر فتح اللوحة: ${t.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun glassPill(
                  active: Boolean,
                  light: Boolean,
                  radiusPx: Float = 999f,
                  activeFill: Int = Color.WHITE
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = radiusPx
                      if (active) {
                          setColor(activeFill)
                          setStroke(2, Color.parseColor("#E6FFFFFF"))
                      } else {
                          setColor(if (light) Color.parseColor("#59FFFFFF") else Color.parseColor("#331E293B"))
                          setStroke(2, if (light) Color.parseColor("#8CFFFFFF") else Color.parseColor("#59FFFFFF"))
                      }
                  }
              }

              private fun circleBadge(active: Boolean): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(if (active) Color.WHITE else Color.parseColor("#38FFFFFF"))
                      if (!active) {
                          setStroke(1, Color.parseColor("#55FFFFFF"))
                      }
                  }
              }

              private fun buildPanelView(light: Boolean): View {
                  val dp = context.resources.displayMetrics.density
                  val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  val backdrop = FrameLayout(context).apply {
                      setBackgroundColor(if (light) Color.parseColor("#4DDBEAFE") else Color.parseColor("#6609111E"))
                      setOnClickListener { hideNow() }
                  }

                  val scroll = ScrollView(context).apply {
                      isVerticalScrollBarEnabled = false
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  val col = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((16 * dp).toInt(), (42 * dp).toInt(), (16 * dp).toInt(), (28 * dp).toInt())
                      setOnClickListener { }
                  }

                  val topBar = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val btnEdit = Button(context).apply {
                      text = "✎"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      background = glassPill(false, light, 999f)
                      val sz = (40 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                      setPadding(0, 0, 0, 0)
                      setOnClickListener {
                          hideNow()
                          try {
                              val i = Intent(context, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(i)
                          } catch (_: Throwable) {
                          }
                      }
                  }

                  val spacerTop = View(context).apply {
                      layoutParams = LinearLayout.LayoutParams(0, 1, 1f)
                  }

                  val btnGear = Button(context).apply {
                      text = "⚙"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      background = glassPill(false, light, 999f)
                      val sz = (40 * dp).toInt()
                      layoutParams = LinearLayout.LayoutParams(sz, sz)
                      setPadding(0, 0, 0, 0)
                      setOnClickListener {
                          hideNow()
                          ShizukuBridge.openSettingsFallback(context, Settings.ACTION_SETTINGS)
                      }
                  }

                  topBar.addView(btnEdit)
                  topBar.addView(spacerTop)
                  topBar.addView(btnGear)
                  col.addView(topBar)

                  val row1 = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (74 * dp).toInt()
                      ).apply { topMargin = (14 * dp).toInt() }
                  }

                  var wifiOn = true
                  val wifiCard = LinearLayout(context).apply {
